# server-блок для Blazor WebAssembly. Копируется в /etc/nginx/conf.d/default.conf
# (перекрывает стоковый). MIME application/wasm уже есть в mime.types nginx ≥1.21.

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip: publish кладёт рядом .gz — отдаём предсжатые (gzip_static), прочее жмём на лету.
    # (.br тоже публикуется, но в стоковом nginx нет brotli-модуля.)
    gzip            on;
    gzip_static     on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    application/wasm image/svg+xml application/octet-stream;

    # SPA: неизвестный путь отдаём в index.html (клиентский роутинг Blazor).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Оболочка всегда свежая — иначе после деплоя клиент не подхватит новые
    # (fingerprint-именованные) ассеты из _framework.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Опционально (perf): файлы _framework именуются с хэшем содержимого,
    # поэтому их можно кэшировать надолго. Раскомментируйте при необходимости:
    # location /_framework/ {
    #     add_header Cache-Control "public, max-age=31536000, immutable";
    # }
}
